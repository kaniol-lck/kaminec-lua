name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / Lua 5.4
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.4 (LuaBinaries)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'lua54.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'lua54'
          curl.exe -L --retry 3 --retry-delay 2 -o $zip 'https://downloads.sourceforge.net/project/luabinaries/5.4.8/Tools%20Executables/lua-5.4.8_Win64_bin.zip'
          if ($LASTEXITCODE -ne 0) { throw "curl failed with exit code $LASTEXITCODE" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter 'lua54.exe' | Select-Object -First 1
          if (-not $exe) { throw 'lua54.exe not found in LuaBinaries zip' }
          "LUA_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe.FullName -v

      - name: Offline tests
        shell: cmd
        run: |
          "%LUA_EXE%" tests\run.lua || exit /b 1
          "%LUA_EXE%" tests\download.lua || exit /b 1
          "%LUA_EXE%" tests\auth.lua || exit /b 1
          "%LUA_EXE%" tests\plugin.lua || exit /b 1
          "%LUA_EXE%" tests\launcher.lua || exit /b 1
          "%LUA_EXE%" tests\import.lua || exit /b 1
          "%LUA_EXE%" tests\graph_setup.lua || exit /b 1
