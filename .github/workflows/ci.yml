name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Lua 5.4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.4 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'lua54.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'lua54'
          curl.exe -L --retry 3 --retry-delay 2 -o $zip 'https://downloads.sourceforge.net/project/luabinaries/5.4.8/Tools%20Executables/lua-5.4.8_Win64_bin.zip'
          if ($LASTEXITCODE -ne 0) { throw "curl failed with exit code $LASTEXITCODE" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter 'lua54.exe' | Select-Object -First 1
          if (-not $exe) { throw 'lua54.exe not found in LuaBinaries zip' }
          "LUA_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe.FullName -v

      - name: Install Lua 5.4 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua5.4 -v

      - name: Install Lua 5.4 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install lua
          lua -v

      - name: Offline tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          "%LUA_EXE%" tests\run.lua || exit /b 1
          "%LUA_EXE%" tests\download.lua || exit /b 1
          "%LUA_EXE%" tests\download_export.lua || exit /b 1
          "%LUA_EXE%" tests\auth.lua || exit /b 1
          "%LUA_EXE%" tests\plugin.lua || exit /b 1
          "%LUA_EXE%" tests\launcher.lua || exit /b 1
          "%LUA_EXE%" tests\launcher_run.lua || exit /b 1
          "%LUA_EXE%" tests\import.lua || exit /b 1
          "%LUA_EXE%" tests\profile.lua || exit /b 1
          "%LUA_EXE%" tests\cli_profile.lua || exit /b 1
          "%LUA_EXE%" tests\graph_setup.lua || exit /b 1

      - name: Offline tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          lua5.4 tests/run.lua
          lua5.4 tests/download.lua
          lua5.4 tests/download_export.lua
          lua5.4 tests/auth.lua
          lua5.4 tests/plugin.lua
          lua5.4 tests/launcher.lua
          lua5.4 tests/launcher_run.lua
          lua5.4 tests/import.lua
          lua5.4 tests/profile.lua
          lua5.4 tests/cli_profile.lua
          lua5.4 tests/graph_setup.lua

      - name: Offline tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          lua tests/run.lua
          lua tests/download.lua
          lua tests/download_export.lua
          lua tests/auth.lua
          lua tests/plugin.lua
          lua tests/launcher.lua
          lua tests/launcher_run.lua
          lua tests/import.lua
          lua tests/profile.lua
          lua tests/cli_profile.lua
          lua tests/graph_setup.lua

